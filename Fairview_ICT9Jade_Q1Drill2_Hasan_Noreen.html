<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <Style>
        body{
            font-family: Consalas;
        }
        section{
            background-color: rgb(225, 219, 219);
            padding: 10px;
            margin: 15px;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgb(0, 0, 0);
        }
        input[type="submit"], select, textarea {
            width: 94%;
            padding:15px;
            border: 1px solid white
            border-radius: 5px;
            text-align: Center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
        }
        </style>
</head>
<body>
    <header>
    <h1>RATE A MOVIE</h1>
    <br>
    <p><span style="font-weight: bold;">SAY SOMETHING ABOUT THE CONTENT</span>.</p>
    </header>

    <section>
        <form action="">
       <img src="https://cdn.vectorstock.com/i/500p/00/61/neon-cinema-signage-vector-21560061.jpg" alt="">
       <label for="movies">Select a Movie</label>
       <select id="movies">
        <option value="m1">Select</option>
        <option value="m2">Now You See Me</option>
        <option value="m3">Insidious: Out of the further</option>
        <option value="m4">Obsession</option>
       </select>
       <br>
       <label for="genre">Genre/s</label>
       <br>
       <Input type="Checkbox" id="general" name="general">
            <label for="genre">Action</label>
            <Input type="Checkbox" id="general" name="general">
            <label for="genre">Comedy</label>
            <Input type="Checkbox" id="general" name="general">
            <label for="genre">Horror</label>
            <Input type="Checkbox" id="general" name="general">
            <label for="genre">Fantacy</label>
            <Input type="Checkbox" id="general" name="general">
            <label for="genre">Sci-Fi</label>
            <Input type="Checkbox" id="general" name="general">
            <label for="genre">Other</label>
            <br>
            <br>
            <label for="rate">Rating</label>
       <br>
       <Input type="radio" id="rate1" name="rating">
            <label for="rate1">🌟</label>
<Input type="radio" id="rate" name="rating">
            <label for="rate2">🌟🌟</label>
            <Input type="radio" id="rate1" name="rating">
            <label for="rate3">🌟🌟🌟</label>
            <Input type="radio" id="rate1" name="rating">
            <label for="rate4">🌟🌟🌟🌟</label>
            <Input type="radio" id="rate1" name="rating">
            <label for="rate5">🌟🌟🌟🌟🌟</label>
            <br><br>
            <texttarea id="review" name="review" rows="4"
            cols="40" placeholder="Movie Review"></texttarea>
            <br>
            <input type="submit" id="submit" name="submit"
            value="Submit Review">
            <br>
            For movie review tips, click it here. <a href="https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide"    target="_Blank">here</a>
        </form>
    </section>
    <!---->
    <!--Reference
    Smith, S. (2026, July 3). How to write a movie Review (A Step-by-Step Guide) — Fantasy/Animation. Fantasy/Animation. https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide
 -->
</body>
</html>
